name: build

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Alle Bücher neu bauen, auch ohne Änderung"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["build.py", "books.toml", "epub.css", ".github/workflows/build.yml"]

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Veröffentlichten Stand holen
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
          else
            mkdir site && git -C site init -q -b gh-pages
            git -C site remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      # Seiten-Cache (komprimiert, mit ETag/Last-Modified): Server antworten meist nur
      # "unverändert". Bilder bleiben draußen, sie werden nur für geänderte Bücher gebraucht.
      - uses: actions/cache@v4
        with:
          path: .cache/pages
          key: pages-${{ github.run_id }}
          restore-keys: pages-

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # pandoc fest gepinnt aus dem GitHub-Release statt apt: der Azure-Mirror hing beim Download.
      - id: pandoc-cache
        uses: actions/cache@v4
        with:
          path: ~/pandoc
          key: pandoc-3.12.1-linux-amd64

      - name: pandoc
        if: steps.pandoc-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: |
          mkdir -p ~/pandoc
          curl -fsSL --retry 5 --retry-all-errors --max-time 120 \
            https://github.com/jgm/pandoc/releases/download/3.12.1/pandoc-3.12.1-linux-amd64.tar.gz \
            | tar -xz -C ~/pandoc --strip-components 1

      - name: Abhängigkeiten
        timeout-minutes: 5
        run: |
          echo "$HOME/pandoc/bin" >> "$GITHUB_PATH"
          pip install -q -r requirements.txt

      - name: Bauen
        run: python build.py --jobs 12 ${{ inputs.force && '--force' || '' }}

      - name: Veröffentlichen, wenn sich etwas geändert hat
        run: |
          cd site
          touch .nojekyll
          git add -A
          if git diff --cached --quiet 2>/dev/null && git rev-parse -q --verify HEAD >/dev/null; then
            echo "Keine Änderung in der Doku, nichts veröffentlicht." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Neu gebaut: $(tr '\n' ' ' < ../changes.txt)" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan publish
          git add -A
          git commit -q -m "Doku-Stand $(date -u +%F)"
          git push -q -f origin publish:gh-pages

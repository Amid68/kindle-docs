# Bücher für den Katalog. Jede Seite wird jede Nacht frisch von der Live-Doku gebaut.
#   method = "crawl" (Standard): Seitenmenü der Doku in Lesereihenfolge abgehen
#   method = "print": Docsy-Druckansicht (_print), ein ganzer Abschnitt auf einer Seite
#   method = "single": Doku, die nur aus einer einzigen Seite besteht
#   method = "git-rst": Sphinx-Quellen direkt aus Git (repo, branch/branch_pattern, root, index)
#   follow_content = true: auch Links im Seitentext folgen (Doku ohne Seitenmenü)
#   git, git_path, git_branch: Repo und Ordner der Doku-Quellen (git_path auch als Liste). Ohne neuen Commit dort wird das
#     Buch nachts übersprungen. "{minor}" bzw. "{version}" in Branch und Start-URL wird aus dem letzten Release ergänzt
#     (release-{minor} -> release-3.5). git_release_repo, wenn die Releases in einem anderen Repo liegen.
#   scope: nur URLs mit diesem Anfang gehören zum Buch (Standard: Ordner der Start-URL)

categories = [
  "Kubernetes",
  "GitOps & CI/CD",
  "Networking & Ingress",
  "Storage & Backup",
  "Infrastructure as Code",
  "Containers & Linux",
  "Observability",
  "Security",
]

[defaults]
max_pages = 400

